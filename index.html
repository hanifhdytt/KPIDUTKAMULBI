async function api(action, d = {}) {
  const maxTry = action === 'scan' || action === 'login' ? 2 : 2;
  let last;
  for (let attempt = 0; attempt < maxTry; attempt++) {
    try {
      const r = await fetch(API, {
        method: 'POST',
        headers: {'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({
          action, ...d,
          nim: U && U.nim,
          pin: U && U.pin,
          token: U && U.token
        })
      });
      const text = await r.text();
      let j;
      try { j = JSON.parse(text); } catch(e) {
        throw new Error('Server sedang sibuk atau tidak merespons.');
      }
      if (!r.ok) {
        throw new Error(String(j.error || ('HTTP ' + r.status + ': permintaan gagal')));
      }
      if (!j.ok) {
        const msg = String(j.error || '');
        if (/SIBUK|server|quota|too many|simultaneous|timeout/i.test(msg) && attempt < maxTry - 1) {
          const retry = new Error('__RETRY__'); retry.retryable = true; throw retry;
        }
        throw new Error(msg || 'Permintaan gagal');
      }
      return j.data;
    } catch (e) {
      last = e;
      const retryable = e && (e.retryable || e.name === 'TypeError' || /Failed to fetch|NetworkError|Load failed/i.test(e.message || ''));
      if (!retryable || attempt >= maxTry - 1) throw e;
      await new Promise(resolve => setTimeout(resolve, 300 * Math.pow(2, attempt) + Math.random() * 180));
    }
  }
  throw last || new Error('Permintaan gagal');
}

function downloadBase64File(file) {
  const bin = atob(file.base64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], {type:file.mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function loadScriptOnce(name, src) {
  if (LIBS[name]) return LIBS[name];

    const el=document.createElement('script'); el.src=src; el.async=true;
    el.onload=resolve; el.onerror=()=>{delete LIBS[name];reject(new Error('Gagal memuat komponen '+name));};
    document.head.appendChild(el);
  });
  return LIBS[name];
}

function extractScanCode(txt) {
  const raw = String(txt || '').trim();
  try {
    const u = new URL(raw);
    const c = u.searchParams.get('c');
    if (c) return c;
  } catch(e) {}
  const m = raw.match(/[?&]c=([^&]+)/);
  if (m) { try { return decodeURIComponent(m[1]); } catch(e) { return m[1]; } }
  return raw.includes('.') ? raw : '';
}

async function startScan() {
  if (scanSubmitting) return;

  if (!retry || !status) return;
  retry.hidden = true; status.textContent = 'Meminta izin kamera…';
  try { await loadScanner(); } catch(e) { status.textContent = e.message || 'Scanner tidak dapat dimuat.'; retry.hidden=false; return; }

    if (scanner) { try { await scanner.stop(); } catch(e) {} try { scanner.clear(); } catch(e) {} scanner=null; }

    await scanner.start({ facingMode: 'environment' }, { fps: 8, qrbox: { width:size, height:size }, aspectRatio:1 }, txt => {
      if (scanSubmitting) return;
      const c = extractScanCode(txt);
      if (!c) return;
      scanSubmitting = true;
      status.textContent = 'QR terbaca • mencatat kehadiran…';
      stopScan();
      submitScan(c);
    });
    status.textContent = 'Kamera aktif • siap scan';
  } catch(e) {
    status.textContent = 'Kamera belum siap. Izinkan akses kamera lalu coba lagi.';
    retry.hidden = false;
  }
}

function stopScan() {
  if (!scanner) return;
  const s = scanner; scanner = null;
  s.stop().catch(() => {}).finally(() => { try { s.clear(); } catch (e) {} });
}

const submitScan = guard(async c => {
  try {
    const [eventId, secret] = c.split('.');
    if (!eventId || !secret) throw new Error('QR absensi tidak valid.');
    const r = await api('scan', { eventId, secret });
    toast('Hadir tercatat: ' + r.acara);
    if (!isAdminRole()) go('home');
  } finally {
    scanSubmitting = false;
  }
});

  const initials=n=>String(n||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
  const draw=()=>{$('#ml').innerHTML=vis().map(m=>`<div class="member-row"><input type="checkbox" data-c="${esc(m.nim)}" ${sel.has(m.nim)?'checked':''} ${m.nim===U.nim?'disabled':''}><div class="member-avatar">${initials(m.nama)}</div><div class="member-main"><b>${esc(m.nama)} ${normalizeRole(m.role)==='superadmin'?'<span class="badge superadmin">Super Admin</span>':(normalizeRole(m.role)==='admin'?'<span class="badge admin">Admin</span>':'')}</b><span class="muted">${esc(m.nim)} · ${esc(m.divisi||'Tanpa divisi')}</span></div><div class="member-actions"><button class="btn sm ghost" data-e="${esc(m.nim)}">Edit</button></div></div>`).join('')||'<div class="empty"><div class="empty-icon">⌕</div><b>Anggota tidak ditemukan</b><p class="muted">Coba nama atau NIM lain.</p></div>';document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>memberForm(list.find(m=>m.nim===b.dataset.e)));document.querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.c):sel.delete(c.dataset.c);sync()});sync()};
  $('#all').onchange=e=>{vis().filter(m=>m.nim!==U.nim).forEach(m=>e.target.checked?sel.add(m.nim):sel.delete(m.nim));draw()};
  $('#del').onclick=guard(async()=>{
    const targets=[...sel];
    const names=list.filter(m=>sel.has(m.nim)).map(m=>m.nama);
    if(!targets.length)return;
    if(!confirm('Hapus '+targets.length+' anggota?\n\n'+names.slice(0,8).join('\n')+'\n\nData absensi dan nilai lama tetap tersimpan di Sheet.'))return;
    const btn=$('#del'); btn.disabled=true; btn.textContent='Menghapus…';
    try{
      const n=await api('memberDelete',{targets});
      toast(n+' anggota berhasil dihapus');
      await anggota();
    }catch(err){
      toast(err.message||'Gagal menghapus anggota',1);
      sync();
    }
  });
  $('#q').oninput=draw;$('#add').onclick=()=>memberForm(null);draw();
}


function memberForm(m) {
  const isNew=!m;
  const mo=modal(`<div class="form-title"><h3>${isNew?'Tambah Anggota':'Edit Anggota'}</h3><p class="muted">${isNew?'Buat akun anggota baru.':'Perbarui informasi akun anggota.'}</p></div><form id="mf" style="text-align:left"><label>NIM</label><input id="mn" inputmode="numeric" placeholder="Masukkan NIM" value="${isNew?'':esc(m.nim)}" ${isNew?'':'readonly'} required><label>Nama</label><input id="mm" placeholder="Nama lengkap" value="${isNew?'':esc(m.nama)}" required><label>PIN</label><input id="mp" type="password" placeholder="${isNew?'Minimal 4 karakter':'Kosongkan jika tidak diubah'}" ${isNew?'required':''}><label>Divisi</label><input id="mv" placeholder="Contoh: Humas, Kreatif" value="${isNew?'':esc(m.divisi||'')}"><label>Peran</label><select id="mr"><option value="member">Anggota</option><option value="admin">Admin</option>${isSuperAdmin()?'<option value="superadmin">Super Admin</option>':''}</select><button class="btn gold" style="width:100%;margin-top:6px">Simpan Anggota</button></form>`);
  $('#mr').value=isNew?'member':(m.role==='superadmin' && !isSuperAdmin()?'admin':m.role);
  $('#mf').onsubmit=guard(async e=>{e.preventDefault();const pin=$('#mp').value.trim(),nim=$('#mn').value.trim();await api('memberSave',{isNew,target:nim,nama:$('#mm').value,newPin:pin,divisi:$('#mv').value,role:$('#mr').value});if(!isNew&&nim===U.nim&&pin){U.pin=pin;if(localStorage.getItem('rem'))localStorage.setItem('rem',JSON.stringify({nim:U.nim,pin}));(localStorage.getItem('u')?localStorage:sessionStorage).setItem('u',JSON.stringify(U))}toast('Anggota berhasil disimpan');mo.remove();await anggota()});
}

start();
</script>
</body>
</html>
